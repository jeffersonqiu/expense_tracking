name: Database migrations
# Applies new files in supabase/migrations/ to the Supabase project on every push
# that changes them. Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [claude/practical-bohr-7tgzwi, main]
    paths: ["supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cqanchifncdswhgsuorf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - name: Show pending migrations
        run: npx -y supabase@3.2.0 db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply migrations
        run: npx -y supabase@3.2.0 db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Applied migrations
        run: npx -y supabase@3.2.0 migration list --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
